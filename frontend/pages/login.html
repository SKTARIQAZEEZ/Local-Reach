<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - LocalReach</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>LocalReach</h1>

            <h2>Welcome back</h2>

            <p class="auth-subtitle">
                Login to manage your LocalReach account.
            </p>

            <form id="loginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <div style="text-align: right; margin: 8px 0 15px;">
                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </div>

    <script src="../js/auth.js"></script>

</body>
</html>
